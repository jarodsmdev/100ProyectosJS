<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar info de IP</title>
    <!-- Pico CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>

  <body>
    <main class="container">
      <form id="form">
        <label for="input">
          IP del usuario:
          <input
            required
            id="input"
            type="text"
            placeholder="Introduce aquí la IP"
            pattern="^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))|([0-9a-fA-F]{1,4}:){7}([0-9a-fA-F]{1,4}|:)|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9]))|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])\.(25[0-5]|(2[0-4]|1{0,1}[0-9])?[0-9])))$"
            title="Introduce una IP válida en el formato IPv4 (XXX.XXX.XXX.XXX) o IPv6."
          />

          <small>Por ejemplo: 54.85.132.205</small>
        </label>
        <button type="submit" id="submit">Buscar información de esta IP</button>
      </form>

      <div>
        <pre id="results"></pre>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
  <footer class="container">
    <hr />
    <p>
      Este proyecto utiliza la API de <a href="https://ipgeolocation.io" target="_blank">ipgeolocation.io</a>.
    </p>
  </footer>
  
</html>
